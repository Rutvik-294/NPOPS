<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPOPS — North Pole Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" class="brand-ring"/>
        <path d="M16 6 L20 16 L16 26 L12 16 Z" class="brand-star"/>
        <line x1="5" y1="16" x2="27" y2="16" class="brand-axis"/>
      </svg>
      <div>
        <div class="brand-name">NPOPS</div>
        <div class="brand-sub">North Pole Operations</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip" id="user-chip"></div>
      <button class="btn ghost small" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="nav-toggle" aria-label="Toggle navigation">☰</button>
      <h1 class="page-title" id="page-title">Dashboard</h1>
      <div class="topbar-right">
        <span class="op-clock mono" id="op-clock" title="Mission clock — hours since first midnight">T+0.0h</span>
        <span class="pill" id="season-pill">Season 2026</span>
      </div>
    </header>
    <div class="view" id="view" aria-live="polite"></div>
  </main>
</div>

<div class="toast-stack" id="toasts"></div>

<script src="/js/app.js"></script>
</body>
</html>
